<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#f5f1e9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#13100d" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-title" content="Mtn Kitchen" />
		<meta name="mobile-web-app-capable" content="yes" />
		<script>
			// Set the theme before first paint to avoid a flash of the wrong mode.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored ||
						(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light');
					if (theme === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		<script>
			// Browsers can offer to install the app before the page's JS has loaded, so catch
			// the offer here and keep it for InstallButton.svelte to pick up.
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__installPrompt = e;
				window.dispatchEvent(new Event('installpromptready'));
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
